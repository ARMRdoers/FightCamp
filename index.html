<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Fighter OS — Operation Nov 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e63946;--orange:#f4a261;--gold:#e9c46a;--teal:#2a9d8f;--blue:#a8dadc;--water:#38b6ff;--bg:#070809;--card:#0d0f14;--border:#1c1f26;--text:#f0f0f0}
html,body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',monospace}
button{cursor:pointer;border:none;font-family:'Barlow Condensed',sans-serif;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97);opacity:.85}
input,textarea{font-family:'JetBrains Mono',monospace;background:#111315;border:1px solid var(--border);color:var(--text);border-radius:3px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:3px}
::-webkit-scrollbar{width:2px;height:2px}::-webkit-scrollbar-thumb{background:var(--red)}
#app{max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:80px}
/* Header */
#header{background:linear-gradient(180deg,#0f1117,var(--bg));border-bottom:1px solid var(--border);padding:14px 14px 10px;position:sticky;top:0;z-index:20}
#xp-bar-fill{transition:width .6s cubic-bezier(.4,0,.2,1)}
/* Nav */
#nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;position:sticky;top:0;z-index:19}
.nav-btn{flex:1;background:none;color:#555;font-weight:700;font-size:10px;letter-spacing:1px;padding:9px 2px;border-bottom:2px solid transparent;transition:color .15s}
.nav-btn.active{color:var(--red);border-bottom-color:var(--red)}
/* Content */
#content{padding:12px 12px 20px}
.tab{display:none}.tab.active{display:block}
/* Animations */
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tab.active{animation:slideIn .2s ease-out}
@keyframes popIn{0%{transform:scale(0) translateX(-50%);opacity:0}100%{transform:scale(1) translateX(-50%);opacity:1}}
#ach-popup{animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
/* Utility */
.line{border-left:2px solid var(--red);padding:3px 0 3px 10px;margin:4px 0;font-family:'JetBrains Mono',monospace;font-size:11px;color:#aaa;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.row{display:flex;gap:8px;align-items:center}
.row-sb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scroll-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}
.scroll-row::-webkit-scrollbar{height:0}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}
.pill{padding:5px 10px;font-weight:800;font-size:10px;letter-spacing:1px;border-radius:3px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:#666;white-space:nowrap;flex-shrink:0}
.pill.active-red{background:var(--red);color:#fff;border-color:var(--red)}
/* Session cards */
.sess-card{padding:12px;border-radius:3px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;border:2px solid var(--border);background:#111315;cursor:pointer;transition:border-color .15s,background .15s}
.sess-card.done{background:#e6394422;border-color:var(--red)}
.habit-card{padding:10px 12px;border-radius:3px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;border:2px solid var(--border);background:#111315;cursor:pointer;transition:all .15s}
.habit-card.done{background:#2a9d8f22;border-color:var(--teal)}
.check-circle{width:22px;height:22px;border-radius:50%;background:#1c1f26;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
/* Submit btn */
#submit-btn{width:100%;background:linear-gradient(135deg,var(--red),#c1121f);color:#fff;padding:14px;font-size:17px;font-weight:900;letter-spacing:4px;border-radius:3px;box-shadow:0 4px 18px #e6394455}
/* Water bar segments */
.w-seg{flex:1;height:8px;border-radius:2px;background:#1c1f26;transition:background .25s}
.w-seg.filled{background:var(--water)}
/* Mini stat card */
.stat-card{padding:10px;border-radius:3px}
/* History badge */
.hbadge{padding:2px 7px;font-size:9px;font-weight:700;border-radius:2px}
/* Phase pill colors */
.pc1{color:var(--red)}.pc2{color:var(--orange)}.pc3{color:var(--gold)}.pc4{color:var(--teal)}.pc5{color:var(--blue)}
/* export/import */
#export-btn,#import-btn{padding:9px;font-size:11px;font-weight:800;letter-spacing:2px;border-radius:3px;width:100%;margin-top:6px}
#export-btn{background:var(--teal);color:#000}
#import-btn{background:none;border:1px solid var(--teal);color:var(--teal)}
</style>
</head>
<body>

      <div class="card" style="padding:7px 5px;text-align:center"><div style="font-size:13px">⚖️</div><div style="font-size:15px;font-weight:900;line-height:1.1" id="qs-weight">150</div><div class="mono" style="font-size:8px;color:#555;margin-top:1px">WEIGHT</div></div>
      <div class="card" style="padding:7px 5px;text-align:center"><div style="font-size:13px">📅</div><div style="font-size:15px;font-weight:900;line-height:1.1" id="qs-day">D1</div><div class="mono" style="font-size:8px;color:#555;margin-top:1px">TODAY</div></div>
      <div class="card" style="padding:7px 5px;text-align:center"><div style="font-size:13px">🏆</div><div style="font-size:15px;font-weight:900;line-height:1.1" id="qs-medals">0</div><div class="mono" style="font-size:8px;color:#555;margin-top:1px">MEDALS</div></div>
    </div>
  </div>

  <!-- NAV -->
  <div id="nav">
    <button class="nav-btn active" data-tab="hq" onclick="switchTab('hq')"><div style="font-size:15px;margin-bottom:1px">🎮</div>HQ</button>
    <button class="nav-btn" data-tab="log" onclick="switchTab('log')"><div style="font-size:15px;margin-bottom:1px">✅</div>LOG</button>
    <button class="nav-btn" data-tab="plan" onclick="switchTab('plan')"><div style="font-size:15px;margin-bottom:1px">📋</div>PLAN</button>
    <button class="nav-btn" data-tab="stats" onclick="switchTab('stats')"><div style="font-size:15px;margin-bottom:1px">📊</div>STATS</button>
    <button class="nav-btn" data-tab="hist" onclick="switchTab('hist')"><div style="font-size:15px;margin-bottom:1px">📅</div>HISTORY</button>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- HQ TAB -->
    <div class="tab active" id="tab-hq"></div>

    <!-- LOG TAB -->
    <div class="tab" id="tab-log"></div>

    <!-- PLAN TAB -->
    <div class="tab" id="tab-plan"></div>

    <!-- STATS TAB -->
    <div class="tab" id="tab-stats"></div>

    <!-- HISTORY TAB -->
    <div class="tab" id="tab-hist"></div>

  </div>
</div>

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ S = JSON.parse(raw); }
  }catch(e){ console.warn("Load failed",e); }
  const dk = todayStr();
  if(S.logs[dk]){ todayLog = {...emptyLog(),...S.logs[dk]}; }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
  catch(e){ alert("Save failed: "+e.message); }
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function todayStr(){ return new Date().toISOString().split("T")[0]; }
function getDayNum(){ const d=Math.floor((new Date()-START_DATE)/86400000)+1; return Math.max(1,Math.min(d,TOTAL_DAYS)); }
function getDaysLeft(){ return Math.max(0,Math.ceil((FIGHT_DATE-new Date())/86400000)); }
function getRank(xp){ let r=RANKS[0]; for(const rk of RANKS){if(xp>=rk.minXP)r=rk;} return r; }
function getNextRank(xp){ for(const r of RANKS){if(xp<r.minXP)return r;} return null; }
function getCurrentPhase(){
  let cum=0;
  for(const p of MACRO_PHASES){ cum+=p.span; if(getDayNum()<=cum) return p; }
  return MACRO_PHASES[MACRO_PHASES.length-1];
}

function checkAchievements(){
  const newOnes=[];
  for(const a of ACHIEVEMENTS){
    if(!S.achievements.includes(a.id) && a.check(S)){
      newOnes.push(a);
      S.achievements.push(a.id);
      S.xp += a.xp;
    }
  }
  return newOnes;
}

function showAchievement(a){
  const el = document.getElementById("ach-popup");
  document.getElementById("ach-icon").textContent = a.icon;
  document.getElementById("ach-title").textContent = a.title;
  document.getElementById("ach-desc").textContent = a.desc;
  document.getElementById("ach-xp").textContent = "+"+a.xp.toLocaleString()+" XP";
  el.style.display = "block";
  setTimeout(()=>{ el.style.display="none"; }, 4000);
}

let currentTab = "hq";
function switchTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+id).classList.add("active");
  document.querySelector(`[data-tab="${id}"]`).classList.add("active");
  currentTab = id;
  renderTab(id);
}

function renderTab(id){
  if(id==="hq")    renderHQ();
  if(id==="log")   renderLog();
  if(id==="plan")  renderPlan("phases");
  if(id==="stats") renderStats();
  if(id==="hist")  renderHist();
}

function updateHeader(){
  const rank = getRank(S.xp);
  const next = getNextRank(S.xp);
  const xpPct = next ? ((S.xp-rank.minXP)/(next.minXP-rank.minXP))*100 : 100;
  document.getElementById("rank-display").innerHTML = `<span>${rank.icon}</span> <span style="color:${rank.color}">${rank.title}</span>`;
  document.getElementById("xp-display").style.color = rank.color;
  document.getElementById("xp-display").textContent = S.xp.toLocaleString()+" XP";
  document.getElementById("xp-next-display").textContent = next ? (next.minXP-S.xp).toLocaleString()+" to "+next.title : "MAX RANK";
  document.getElementById("xp-bar-fill").style.width = Math.min(xpPct,100)+"%";
  document.getElementById("xp-bar-fill").style.background = `linear-gradient(90deg,${rank.color},${next?.color||rank.color})`;
  document.getElementById("days-left").textContent = getDaysLeft();
  document.getElementById("qs-streak").textContent = S.streak+"d";
  document.getElementById("qs-weight").textContent = S.currentWeight+"lb";
  document.getElementById("qs-day").textContent = "D"+getDayNum();
  document.getElementById("qs-medals").textContent = S.achievements.length;
}

// ═══════════════════════════════════════
// LOG ACTIONS
// ═══════════════════════════════════════
function toggleSession(k){
  todayLog.sessions[k] = !todayLog.sessions[k];
  renderLog();
}
function toggleSparring(){
  todayLog.sparring = !todayLog.sparring;
  renderLog();
}
function toggleHabit(id){
  todayLog.habits[id] = !todayLog.habits[id];
  renderLog();
}
function setBottles(i){
  const filled = i < todayLog.waterBottles;
  todayLog.waterBottles = filled ? i : i+1;
  todayLog.habits.water = todayLog.waterBottles >= 8;
  renderLog();
}
function addBottle(){
  todayLog.waterBottles = Math.min(8, todayLog.waterBottles+1);
  todayLog.habits.water = todayLog.waterBottles >= 8;
  renderLog();
}
function removeBottle(){
  todayLog.waterBottles = Math.max(0, todayLog.waterBottles-1);
  todayLog.habits.water = todayLog.waterBottles >= 8;
  renderLog();
}

function submitDay(){
  const dk = todayStr();
  const wVal = document.getElementById("weight-input")?.value || todayLog.weight;
  const nVal = document.getElementById("notes-input")?.value || todayLog.notes;
  todayLog.weight = wVal;
  todayLog.notes = nVal;

  const already = !!S.logs[dk]?.completed;
  let xp = 0;
  if(todayLog.sessions.outdoor) xp+=XP_VALUES.outdoor;
  if(todayLog.sessions.lift)    xp+=XP_VALUES.lift;
  if(todayLog.sessions.mma)     xp+=XP_VALUES.mma;
  if(todayLog.habits.water)     xp+=XP_VALUES.water;
  if(todayLog.habits.nutrition) xp+=XP_VALUES.nutrition;
  if(todayLog.habits.reading)   xp+=XP_VALUES.reading;
  if(todayLog.habits.photo)     xp+=XP_VALUES.photo;
  if(todayLog.sparring)         xp+=XP_VALUES.sparring;

  const allH = Object.values(todayLog.habits).every(Boolean);
  const yest = new Date(Date.now()-86400000).toISOString().split("T")[0];
  const hadYest = !!S.logs[yest]?.completed;
  const newStreak = already ? S.streak : (hadYest ? S.streak+1 : 1);
  if(newStreak>1 && !already) xp += XP_VALUES.streak_bonus * Math.min(newStreak,10);

  todayLog.xpEarned = xp;
  todayLog.completed = true;

  if(wVal){
    const ei = S.weights.findIndex(w=>w.date===dk);
    if(ei>=0) S.weights[ei]={date:dk,weight:parseFloat(wVal)};
    else S.weights.push({date:dk,weight:parseFloat(wVal)});
  }

  if(!already){
    S.xp += xp;
    S.streak = newStreak;
    S.maxStreak = Math.max(S.maxStreak, newStreak);
    S.currentWeight = wVal ? parseFloat(wVal) : S.currentWeight;
    S.totalDaysLogged++;
    S.totalSessions += (todayLog.sessions.outdoor?1:0)+(todayLog.sessions.lift?1:0)+(todayLog.sessions.mma?1:0)+(todayLog.sparring?1:0);
    S.mmaSessions += todayLog.sessions.mma?1:0;
    S.liftSessions += todayLog.sessions.lift?1:0;
    S.outdoorSessions += todayLog.sessions.outdoor?1:0;
    S.sparringSessions += todayLog.sparring?1:0;
    S.perfectHabitDays += allH?1:0;
  } else {
    if(wVal) S.currentWeight = parseFloat(wVal);
  }

  S.logs[dk] = {...todayLog};

  const newAch = checkAchievements();
  saveState();
  updateHeader();
  renderLog();
  renderHQ();

  if(newAch.length>0) showAchievement(newAch[0]);
}

// ═══════════════════════════════════════
// STATS TAB
// ═══════════════════════════════════════
function renderStats(){
  const rank = getRank(S.xp);
  const wl = S.startWeight - S.currentWeight;
  const last14w = S.weights.slice(-14);

  const statCards = [
    {l:"TOTAL XP",v:S.xp.toLocaleString(),c:"var(--gold)",ic:"⚡"},
    {l:"STREAK",v:S.streak+"d",c:"var(--red)",ic:"🔥"},
    {l:"MAX STREAK",v:S.maxStreak+"d",c:"var(--orange)",ic:"📈"},
    {l:"DAYS LOGGED",v:S.totalDaysLogged,c:"var(--teal)",ic:"📅"},
    {l:"TOTAL SESSIONS",v:S.totalSessions,c:"var(--blue)",ic:"💪"},
    {l:"MMA SESSIONS",v:S.mmaSessions,c:"var(--orange)",ic:"🥊"},
    {l:"LIFT SESSIONS",v:S.liftSessions,c:"var(--red)",ic:"🏋️"},
    {l:"OUTDOOR",v:S.outdoorSessions,c:"var(--gold)",ic:"🌅"},
    {l:"SPARRING",v:S.sparringSessions,c:"#9b5de5",ic:"⚡"},
    {l:"PERFECT DAYS",v:S.perfectHabitDays,c:"var(--teal)",ic:"💯"},
  ].map(({l,v,c,ic})=>`<div class="card" style="padding:10px;border-left:3px solid ${c}"><div style="font-size:18px">${ic}</div><div style="font-size:20px;font-weight:900;color:${c};line-height:1.1;margin-top:3px">${v}</div><div class="mono" style="font-size:8px;color:#555;margin-top:2px;letter-spacing:1px">${l}</div></div>`).join("");

  // Weight chart
  let weightChart = `<div class="mono" style="font-size:10px;color:#555;text-align:center;padding:16px 0">Log your weight daily to see your cut here</div>`;
  if(last14w.length>0){
    const allW = last14w.map(w=>w.weight);
    const mn = Math.min(...allW), mx = Math.max(...allW), range = mx-mn||1;
    const bars = last14w.map(({weight},i)=>{
      const h = ((weight-mn)/range)*50+10;
      const isLow = weight===Math.min(...allW);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
        <div class="mono" style="font-size:7px;color:${isLow?"var(--teal)":"#555"}">${weight}</div>
        <div style="width:100%;background:${isLow?"var(--teal)":"var(--red)"};height:${h}px;border-radius:2px 2px 0 0;min-height:4px"></div>
      </div>`;
    }).join("");
    weightChart = `<div style="display:flex;align-items:flex-end;gap:3px;height:70px;margin-bottom:6px">${bars}</div>
      <div style="display:flex;justify-content:space-between">
        <div><div class="mono" style="font-size:8px;color:#555">START</div><div style="font-size:14px;font-weight:800">${S.startWeight}lbs</div></div>
        <div style="text-align:center"><div class="mono" style="font-size:8px;color:var(--gold)">LOST</div><div style="font-size:14px;font-weight:800;color:var(--gold)">${wl.toFixed(1)}lbs</div></div>
        <div style="text-align:right"><div class="mono" style="font-size:8px;color:#555">NOW</div><div style="font-size:14px;font-weight:800">${S.currentWeight}lbs</div></div>
      </div>`;
  }

  // Rank ladder
  const rankLadder = RANKS.map(r=>{
    const unlocked=S.xp>=r.minXP; const isCur=r.title===rank.title;
    return `<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #1c1f26;opacity:${unlocked?1:.3}">
      <div style="font-size:18px;flex-shrink:0">${r.icon}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:800;color:${isCur?r.color:"#777"};letter-spacing:1px">${r.title}</div><div class="mono" style="font-size:8px;color:#555">${r.minXP.toLocaleString()} XP</div></div>
      ${isCur?`<div style="background:${r.color};color:#000;font-size:8px;font-weight:700;padding:2px 6px;letter-spacing:1px">YOU</div>`:unlocked?"<div style='color:var(--teal);font-size:14px'>✓</div>":""}
    </div>`;
  }).join("");

  // Achievements
  const achList = ACHIEVEMENTS.map(a=>{
    const u=S.achievements.includes(a.id);
    return `<div style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #1c1f26;opacity:${u?1:.4}">
      <div style="font-size:22px;flex-shrink:0;filter:${u?"none":"grayscale(1)"}"> ${a.icon}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:800;color:${u?"var(--gold)":"#666"};letter-spacing:1px">${a.title}</div><div class="mono" style="font-size:9px;color:#666;margin-top:1px">${a.desc}</div></div>
      <div style="text-align:right;flex-shrink:0"><div class="mono" style="font-size:10px;font-weight:700;color:${u?"var(--gold)":"#555"}">+${a.xp.toLocaleString()}</div>${u?"<div style='color:var(--teal);font-size:12px;margin-top:2px'>✓</div>":""}</div>
    </div>`;
  }).join("");

  document.getElementById("tab-stats").innerHTML = `
    <div style="font-size:20px;font-weight:900;letter-spacing:2px;margin-bottom:12px">YOUR STATS</div>
    <div class="grid2 mb12">${statCards}</div>
    <div class="card mb10" style="padding:12px">
      <div class="mono mb8" style="font-size:9px;color:#555;letter-spacing:3px">WEIGHT HISTORY</div>
      ${weightChart}
    </div>
    <div class="card mb10" style="padding:12px">
      <div class="mono mb10" style="font-size:9px;color:#555;letter-spacing:3px">RANK LADDER</div>
      ${rankLadder}
    </div>
    <div class="card mb10" style="padding:12px">
      <div class="mono mb10" style="font-size:9px;color:#555;letter-spacing:3px">ACHIEVEMENTS (${S.achievements.length}/${ACHIEVEMENTS.length})</div>
      ${achList}
    </div>
    <!-- Export / Import -->
    <div class="card" style="padding:12px">
      <div class="mono mb8" style="font-size:9px;color:#555;letter-spacing:3px">BACKUP & RESTORE</div>
      <button id="export-btn" onclick="exportData()">⬇ EXPORT SAVE FILE</button>
      <button id="import-btn" onclick="document.getElementById('import-file').click()">⬆ IMPORT SAVE FILE</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"/>
      <button onclick="resetData()" style="padding:9px;font-size:11px;font-weight:800;letter-spacing:2px;border-radius:3px;width:100%;margin-top:6px;background:none;border:1px solid var(--red);color:var(--red)">RESET ALL DATA</button>
    </div>
  `;
}

// ═══════════════════════════════════════
// HISTORY TAB
// ═══════════════════════════════════════
function renderHist(){
  const logs = Object.entries(S.logs).sort(([a],[b])=>b.localeCompare(a)).slice(0,30);
  if(logs.length===0){
    document.getElementById("tab-hist").innerHTML=`<div style="font-size:20px;font-weight:900;letter-spacing:2px;margin-bottom:12px">TRAINING LOG</div><div class="card" style="padding:36px;text-align:center"><div style="font-size:36px;margin-bottom:10px">📋</div><div class="mono" style="font-size:10px;color:#555">No sessions yet. Start today!</div></div>`;
    return;
  }
  const items = logs.map(([date,log])=>{
    const d=new Date(date); const dn=Math.floor((new Date(date)-START_DATE)/86400000)+1;
    const allDone=log.sessions?.outdoor&&log.sessions?.lift&&log.sessions?.mma;
    const sc=(log.sessions?.outdoor?1:0)+(log.sessions?.lift?1:0)+(log.sessions?.mma?1:0)+(log.sparring?1:0);
    const badges = [
      log.sessions?.outdoor&&`<span class="hbadge" style="background:#e9c46a22;color:var(--gold)">🌅 OUT</span>`,
      log.sessions?.lift&&`<span class="hbadge" style="background:#e6394422;color:var(--red)">🏋️ LIFT</span>`,
      log.sessions?.mma&&`<span class="hbadge" style="background:#f4a26122;color:var(--orange)">🥊 MMA</span>`,
      log.sparring&&`<span class="hbadge" style="background:#9b5de522;color:#9b5de5">⚡ SPAR</span>`,
      log.habits?.water&&`<span class="hbadge" style="background:#2a9d8f22;color:var(--teal)">💧</span>`,
      log.habits?.nutrition&&`<span class="hbadge" style="background:#2a9d8f22;color:var(--teal)">🥗</span>`,
      log.habits?.reading&&`<span class="hbadge" style="background:#2a9d8f22;color:var(--teal)">📖</span>`,
      log.habits?.photo&&`<span class="hbadge" style="background:#2a9d8f22;color:var(--teal)">📸</span>`,
    ].filter(Boolean).join("");
    return `<div class="card mb8" style="padding:11px;border-left:3px solid ${allDone?"var(--red)":"#444"}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">
        <div><div class="mono" style="font-size:8px;color:#555;letter-spacing:2px">DAY ${dn}</div><div style="font-size:14px;font-weight:800;letter-spacing:1px">${d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase()}</div></div>
        <div style="text-align:right"><div style="font-size:13px;font-weight:800;color:var(--gold)">+${log.xpEarned} XP</div><div class="mono" style="font-size:8px;color:#555">${sc} sess.</div></div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:${(log.weight||log.waterBottles||log.notes)?'5px':'0'}">${badges}</div>
      ${log.weight?`<div class="mono" style="font-size:9px;color:var(--gold)">⚖️ ${log.weight} lbs</div>`:""}
      ${log.waterBottles?`<div class="mono" style="font-size:9px;color:var(--water);margin-top:3px">💧 ${log.waterBottles}/8 bottles (${log.waterBottles*16}oz)</div>`:""}
      ${log.notes?`<div class="mono" style="font-size:9px;color:#888;margin-top:5px;line-height:1.5;border-left:2px solid #333;padding-left:7px">${log.notes}</div>`:""}
    </div>`;
  }).join("");
  document.getElementById("tab-hist").innerHTML=`<div style="font-size:20px;font-weight:900;letter-spacing:2px;margin-bottom:12px">TRAINING LOG</div>${items}`;
}

// ═══════════════════════════════════════
// EXPORT / IMPORT / RESET
// ═══════════════════════════════════════
function exportData(){
  const json = JSON.stringify(S, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "fighter-os-save.json";
  a.click(); URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const imported = JSON.parse(ev.target.result);
      if(imported.xp !== undefined){
        S = imported;
        const dk = todayStr();
        if(S.logs[dk]){ todayLog = {...emptyLog(),...S.logs[dk]}; }
        saveState(); updateHeader(); renderTab(currentTab);
        alert("Save file imported successfully!");
      } else { alert("Invalid save file."); }
    }catch(err){ alert("Failed to read file: "+err.message); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(confirm("Reset ALL progress? This cannot be undone.")){
    S = JSON.parse(JSON.stringify(INIT_STATE));
    todayLog = emptyLog();
    saveState(); updateHeader(); renderTab(currentTab);
  }
}
